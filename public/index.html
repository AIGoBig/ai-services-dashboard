<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Services Dashboard</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- Mobile Header (visible < 768px) -->
<div class="mobile-header">
  <button class="hamburger-btn" onclick="toggleMobileSidebar()" aria-label="Toggle navigation">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span class="mobile-title">AI Services Dashboard</span>
</div>

<!-- Mobile Sidebar Backdrop -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>

<!-- App Layout -->
<div class="app-layout">

  <!-- Sidebar Navigation -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="sidebar-brand-text">
        <h1>AI Services</h1>
        <div class="subtitle">统一监控面板</div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="sidebar-nav">
      <div class="sidebar-nav-label">监控</div>
      <button class="nav-item active" data-tab="overview" onclick="switchTab('overview')" tabindex="0" role="tab" aria-selected="true">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-label">总览</span>
      </button>
      <button class="nav-item" data-tab="services" onclick="switchTab('services')" tabindex="0" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg>
        <span class="nav-label">服务</span>
      </button>
      <button class="nav-item" data-tab="tasks" onclick="switchTab('tasks')" tabindex="0" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="nav-label">定时任务</span>
      </button>
      <div class="sidebar-nav-label" style="margin-top:16px">工具</div>
      <button class="nav-item" data-tab="aicli" onclick="switchTab('aicli')" tabindex="0" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="nav-label">AI CLI</span>
      </button>
      <button class="nav-item" data-tab="logs" onclick="switchTab('logs')" tabindex="0" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="nav-label">日志</span>
      </button>
      <button class="nav-item" data-tab="webviews" onclick="switchTab('webviews')" tabindex="0" role="tab" aria-selected="false">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <span class="nav-label">页面看板</span>
      </button>
    </div>

    <!-- Status Strip -->
    <div class="sidebar-status" id="sidebarStatus">
      <span class="status-dot-mini online" id="sidebarOnlineDot"></span>
      <span class="sidebar-status-text" id="sidebarStatusText">--/-- 在线</span>
      <span class="status-dot-mini warning" id="sidebarIssueDot" style="display:none"></span>
      <span class="sidebar-status-text" id="sidebarIssueText" style="display:none"></span>
    </div>

    <!-- Theme Toggle -->
    <button class="collapse-toggle" onclick="toggleTheme()" tabindex="0" aria-label="Toggle theme">
      <svg class="toggle-icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="collapse-label">浅色模式</span>
    </button>

    <!-- Collapse Toggle -->
    <button class="collapse-toggle" onclick="toggleSidebar()" tabindex="0" aria-label="Toggle sidebar">
      <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      <span class="collapse-label">收起侧栏</span>
    </button>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content" id="mainContent">

    <!-- Overview Tab -->
    <div id="tab-overview" class="tab-content active" role="tabpanel" aria-labelledby="tab-overview">
      <div class="refresh-bar">
        <button class="refresh-btn" onclick="loadOverview()">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新
        </button>
        <span class="last-refresh" id="lastRefreshOverview">--</span>
      </div>
      <div id="overview"></div>
    </div>

    <!-- Services Tab -->
    <div id="tab-services" class="tab-content" role="tabpanel" aria-labelledby="tab-services">
      <div class="refresh-bar">
        <div style="display:flex;gap:8px;align-items:center">
          <button class="refresh-btn" onclick="loadUnifiedServices()">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
        <span class="last-refresh" id="lastRefreshServices">--</span>
      </div>
      <div id="svc-cat-filter" class="cat-filter"></div>
      <div id="services"></div>
    </div>

    <!-- Tasks Tab -->
    <div id="tab-tasks" class="tab-content" role="tabpanel" aria-labelledby="tab-tasks">
      <div class="refresh-bar">
        <button class="refresh-btn" onclick="loadTasks()">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新
        </button>
        <span class="last-refresh" id="lastRefreshTasks">--</span>
      </div>
      <div id="tasks"></div>
    </div>

    <!-- AI CLI Tab -->
    <div id="tab-aicli" class="tab-content" role="tabpanel" aria-labelledby="tab-aicli">
      <div class="refresh-bar">
        <button class="refresh-btn" onclick="loadAiCli()">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新
        </button>
        <span class="last-refresh" id="lastRefreshAiCli">--</span>
      </div>
      <div id="aicli"></div>
    </div>

    <!-- Dashboard Log Tab -->
    <div id="tab-logs" class="tab-content" role="tabpanel" aria-labelledby="tab-logs">
      <div class="refresh-bar">
        <div style="display:flex;gap:8px;align-items:center">
          <button class="refresh-btn" onclick="loadDashLogs()">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
          <select id="logSourceFilter" onchange="loadDashLogs()" style="background:var(--color-bg-secondary);color:var(--color-text-primary);border:1px solid var(--color-border-hover);border-radius:var(--radius-xs);padding:4px 8px;font-size:12px;font-family:var(--font-sans)">
            <option value="">全部来源</option>
            <option value="system">系统</option>
            <option value="service">服务</option>
            <option value="task">定时任务</option>
            <option value="ai-cli">AI CLI</option>
          </select>
          <select id="logTypeFilter" onchange="loadDashLogs()" style="background:var(--color-bg-secondary);color:var(--color-text-primary);border:1px solid var(--color-border-hover);border-radius:var(--radius-xs);padding:4px 8px;font-size:12px;font-family:var(--font-sans)">
            <option value="">全部类型</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
        </div>
        <span class="last-refresh" id="lastRefreshLogs">--</span>
      </div>
      <div id="dashlogs"></div>
    </div>

    <!-- Web Views Tab -->
    <div id="tab-webviews" class="tab-content" role="tabpanel" aria-labelledby="tab-webviews">
      <div class="refresh-bar">
        <button class="refresh-btn" onclick="loadWebViews()">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新
        </button>
        <span class="last-refresh" id="lastRefreshWebViews">--</span>
      </div>
      <div id="webviews" class="webview-grid"></div>
    </div>

  </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- External JS Modules (order matters) -->
<script src="/js/state.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/overview.js"></script>
<script src="/js/services.js"></script>
<script src="/js/tasks.js"></script>
<script src="/js/aicli.js"></script>
<script src="/js/logs.js"></script>
<script src="/js/webviews.js"></script>
<script src="/js/app.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
